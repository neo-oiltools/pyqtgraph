name: Apply peak-position fix

on:
  push:
    branches:
      - fix/preserve-peak-positions
    paths:
      - .github/workflows/apply-peak-position-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/preserve-peak-positions
          fetch-depth: 0

      - name: Apply surgical source and test changes
        run: python .github/scripts/apply_peak_position_fix.py

      - name: Remove one-shot tooling
        run: rm .github/workflows/apply-peak-position-fix.yml .github/scripts/apply_peak_position_fix.py

      - name: Commit surgical fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve peak positions during downsampling"
          git push origin HEAD:fix/preserve-peak-positions
