name: Apply NaN-safe peak fix

on:
  push:
    branches:
      - fix/preserve-peak-positions
    paths:
      - .github/workflows/apply-nan-safe-peak-fix.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/preserve-peak-positions
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Linux Qt runtime
        run: |
          sudo apt-get update -y --allow-releaseinfo-change
          sudo apt-get install --no-install-recommends -y \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Install focused test dependencies
        run: python -m pip install PyQt6 numpy pytest pytest-qt .

      - name: Apply surgical source and test changes
        run: python .github/scripts/apply_nan_safe_peak_fix.py

      - name: Run peak-downsampling regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/graphicsItems/test_PlotDataItem.py -k peak_downsampling -v

      - name: Remove one-shot tooling
        run: rm .github/workflows/apply-nan-safe-peak-fix.yml .github/scripts/apply_nan_safe_peak_fix.py

      - name: Commit verified surgical fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve gaps during peak downsampling"
          git push origin HEAD:fix/preserve-peak-positions
